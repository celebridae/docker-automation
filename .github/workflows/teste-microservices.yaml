name: Test Cesar Microservice

on:
    push:
        branches: [aula-01]
    pull_request: 
        branches: [aula-01]

jobs:
    test-auth-service:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Set up Python
            uses: actions/setup-python@v2
            with:
              python-version: '3.12.4'
 
          - name: Install dependencies
            working-directory: ./burguer-app/auth-service
            run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
            
          - name: Run tests 
            working-directory: ./burguer-app/auth-service
            run: |
                pytest          
    test-order-service:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Set up Python
            uses: actions/setup-python@v2
            with:
              python-version: '3.12.4'
 
          - name: Install dependencies
            working-directory: ./burguer-app/order-service
            run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
                pip install radon                
          - name: Run tests 
            working-directory: ./burguer-app/order-service
            run: |
                pytest -v --cov=models --cov=services --cov=config --cov=controllers
                radon cc ./models/order_model.py

    test-product-service:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v2
              with:
                python-version: '3.12.4'

            - name: Install dependencies
              working-directory: ./burguer-app/product-service
              run: |
                python -m pip install --upgrade pip
