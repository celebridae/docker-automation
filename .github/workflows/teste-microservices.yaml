            - name: Run tests 
              working-directory: ./burguer-app/product-service
              run: |
                pytest -v --cov=models --cov=services --cov=config --cov=controllers
                radon cc ./models/product_model.py
    test-user-service:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v2
              with:
                python-version: '3.12.4'

            - name: Install dependencies
              working-directory: ./burguer-app/user-service
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
                pip install radon                
            - name: Run tests 
              working-directory: ./burguer-app/user-service
              run: |
                pytest -v --cov=models --cov=services --cov=config --cov=controllers
                radon cc ./models/user_model.py                